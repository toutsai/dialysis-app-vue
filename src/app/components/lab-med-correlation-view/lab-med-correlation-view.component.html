<div class="lab-med-correlation" *ngIf="patient">
  <div class="panel-header">
    <h4 class="panel-title">檢驗/用藥關聯</h4>
  </div>

  <div class="correlation-list" *ngIf="hasCorrelations()">
    <div
      *ngFor="let row of correlations"
      class="correlation-row"
    >
      <div class="lab-info">
        <span class="lab-name">{{ row.labName }}</span>
        <span class="lab-value">
          {{ row.labValue }}
          <span class="lab-unit">{{ row.labUnit }}</span>
        </span>
        <span class="trend-indicator" [ngClass]="getTrendClass(row.trend)">
          {{ getTrendIcon(row.trend) }}
        </span>
        <span class="lab-date">{{ row.labDate }}</span>
      </div>

      <div class="related-meds" *ngIf="row.relatedMeds.length > 0">
        <span class="meds-label">相關用藥:</span>
        <div class="med-tags">
          <span
            *ngFor="let med of row.relatedMeds"
            class="med-tag"
            [title]="med.dose + ' ' + med.frequency"
          >
            {{ med.name }}
            <span class="med-dose">{{ med.dose }}</span>
          </span>
        </div>
      </div>

      <div class="no-meds" *ngIf="row.relatedMeds.length === 0">
        <span class="meds-label">無相關用藥</span>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!hasCorrelations()">
    無檢驗/用藥關聯資料
  </div>
</div>
