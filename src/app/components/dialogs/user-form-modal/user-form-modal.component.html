@if (isVisible) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-container">
      <div class="modal-header">
        <h3>{{ isEditing ? '編輯使用者' : '新增使用者' }}</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="displayName">姓名 <span class="required">*</span></label>
          <input
            id="displayName"
            type="text"
            class="form-input"
            [(ngModel)]="formData.displayName"
            placeholder="請輸入姓名"
          />
        </div>

        <div class="form-group">
          <label for="email">電子郵件 <span class="required">*</span></label>
          <input
            id="email"
            type="email"
            class="form-input"
            [(ngModel)]="formData.email"
            placeholder="請輸入電子郵件"
            [disabled]="isEditing"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="role">角色 <span class="required">*</span></label>
            <select id="role" class="form-select" [(ngModel)]="formData.role">
              @for (role of roles; track role.value) {
                <option [value]="role.value">{{ role.label }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="department">部門 <span class="required">*</span></label>
            <select id="department" class="form-select" [(ngModel)]="formData.department">
              @for (dept of departments; track dept.value) {
                <option [value]="dept.value">{{ dept.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="formData.isActive" />
            <span>啟用帳號</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
        <button class="btn btn-primary" (click)="onSave()" [disabled]="!isFormValid">
          {{ isEditing ? '更新' : '建立' }}
        </button>
      </div>
    </div>
  </div>
}
