@if (isVisible) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-container">
      <div class="dialog-header">
        <h3>新增任務 / 訊息</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-row">
          <div class="form-group">
            <label>類型 <span class="required">*</span></label>
            <select class="form-select" [(ngModel)]="formData.taskType">
              @for (type of taskTypes; track type.value) {
                <option [value]="type.value">{{ type.label }}</option>
              }
            </select>
          </div>
          <div class="form-group">
            <label>優先度</label>
            <div class="priority-group">
              @for (p of priorities; track p.value) {
                <button
                  class="priority-btn"
                  [class.active]="formData.priority === p.value"
                  [style.--priority-color]="p.color"
                  (click)="formData.priority = p.value"
                >
                  {{ p.label }}
                </button>
              }
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>標題 <span class="required">*</span></label>
          <input
            type="text"
            class="form-input"
            [(ngModel)]="formData.title"
            placeholder="請輸入任務標題"
          />
        </div>

        <div class="form-group">
          <label>相關病患</label>
          @if (preselectedPatient) {
            <div class="selected-patient">{{ preselectedPatient.name }} ({{ preselectedPatient.medicalRecordNumber }})</div>
          } @else {
            <select class="form-select" [(ngModel)]="formData.patientId">
              <option value="">無（選填）</option>
              @for (p of allPatients; track p.id) {
                <option [value]="p.id">{{ p.name }} ({{ p.medicalRecordNumber }})</option>
              }
            </select>
          }
        </div>

        <div class="form-group">
          <label>詳細說明</label>
          <textarea
            class="form-textarea"
            [(ngModel)]="formData.description"
            placeholder="請輸入詳細說明"
            rows="4"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>期限日期</label>
            <input type="date" class="form-input" [(ngModel)]="formData.dueDate" />
          </div>
          <div class="form-group">
            <label>期限時間</label>
            <input type="time" class="form-input" [(ngModel)]="formData.dueTime" />
          </div>
        </div>

        <div class="form-group">
          <label>指派對象</label>
          <input
            type="text"
            class="form-input"
            [(ngModel)]="formData.assignedTo"
            placeholder="輸入負責人姓名（選填）"
          />
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
        <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!isFormValid">建立</button>
      </div>
    </div>
  </div>
}
