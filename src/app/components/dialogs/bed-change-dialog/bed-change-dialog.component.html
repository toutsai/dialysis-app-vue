@if (isVisible && patient) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-container">
      <div class="dialog-header">
        <h3>換床作業</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="current-info">
          <span class="info-label">病患:</span>
          <span class="info-value">{{ patient.name }}</span>
          <span class="info-label">目前床號:</span>
          <span class="info-value bed-badge">{{ patient.bedNumber }}</span>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="isSwap" />
            <span>與其他病患互換床位</span>
          </label>
        </div>

        @if (isSwap) {
          <div class="form-group">
            <label>選擇互換對象</label>
            <select class="form-select" [(ngModel)]="swapTargetId">
              <option value="">請選擇...</option>
              @for (p of occupiedBeds; track p.id) {
                <option [value]="p.id">{{ p.name }} (床號: {{ p.bedNumber }})</option>
              }
            </select>
          </div>
        } @else {
          <div class="form-group">
            <label>新床號</label>
            <input
              type="text"
              class="form-input"
              [(ngModel)]="newBedNumber"
              placeholder="請輸入新床號"
            />
          </div>
        }

        <div class="form-group">
          <label>換床原因</label>
          <textarea
            class="form-textarea"
            [(ngModel)]="reason"
            placeholder="請輸入換床原因（選填）"
            rows="3"
          ></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
        <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!canSubmit">確定換床</button>
      </div>
    </div>
  </div>
}
