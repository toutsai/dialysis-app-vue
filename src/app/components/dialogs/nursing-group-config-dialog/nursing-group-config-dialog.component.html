@if (isVisible) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-container">
      <div class="dialog-header">
        <h3>護理分組設定</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>組別名稱 <span class="required">*</span></label>
          <input
            type="text"
            class="form-input"
            [(ngModel)]="groupData.groupName"
            placeholder="請輸入組別名稱"
          />
        </div>

        <div class="form-group">
          <label>負責護理師</label>
          <input
            type="text"
            class="form-input"
            [(ngModel)]="groupData.nurseName"
            placeholder="請輸入護理師姓名"
          />
        </div>

        <div class="form-group">
          <label>標記顏色</label>
          <div class="color-picker">
            @for (color of colors; track color) {
              <button
                class="color-btn"
                [style.background-color]="color"
                [class.active]="groupData.color === color"
                (click)="selectColor(color)"
              ></button>
            }
          </div>
        </div>

        <div class="form-group">
          <label>分配病患 <span class="required">*</span> (已選 {{ groupData.patientIds.length }} 位)</label>
          <div class="patient-search">
            <input
              type="text"
              class="search-input"
              [(ngModel)]="searchQuery"
              placeholder="搜尋病患..."
            />
          </div>
          <div class="patient-checklist">
            @for (patient of filteredPatients; track patient.id) {
              <label class="patient-check-item" (click)="togglePatient(patient.id)">
                <input
                  type="checkbox"
                  [checked]="isPatientSelected(patient.id)"
                />
                <span class="patient-bed">{{ patient.bedNumber }}</span>
                <span class="patient-name">{{ patient.name }}</span>
              </label>
            }
            @if (filteredPatients.length === 0) {
              <p class="empty-text">無符合的病患</p>
            }
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
        <button class="btn btn-primary" (click)="onSave()" [disabled]="!isFormValid">儲存</button>
      </div>
    </div>
  </div>
}
