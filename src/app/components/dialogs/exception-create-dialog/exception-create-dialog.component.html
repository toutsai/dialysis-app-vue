@if (isVisible) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-container">
      <div class="dialog-header">
        <h3>排程異常處理</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>病患 <span class="required">*</span></label>
          @if (patient) {
            <div class="selected-patient">{{ patient.name }} ({{ patient.medicalRecordNumber }})</div>
          } @else {
            <select class="form-select" [(ngModel)]="formData.patientId">
              <option value="">請選擇病患...</option>
              @for (p of allPatients; track p.id) {
                <option [value]="p.id">{{ p.name }} ({{ p.medicalRecordNumber }})</option>
              }
            </select>
          }
        </div>

        <div class="form-group">
          <label>異常類型 <span class="required">*</span></label>
          <select class="form-select" [(ngModel)]="formData.exceptionType">
            @for (type of exceptionTypes; track type.value) {
              <option [value]="type.value">{{ type.label }}</option>
            }
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>日期 <span class="required">*</span></label>
            <input type="date" class="form-input" [(ngModel)]="formData.date" />
          </div>
          <div class="form-group">
            <label>班次</label>
            <select class="form-select" [(ngModel)]="formData.shift">
              @for (shift of shifts; track shift.value) {
                <option [value]="shift.value">{{ shift.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>原因 <span class="required">*</span></label>
          <textarea
            class="form-textarea"
            [(ngModel)]="formData.reason"
            placeholder="請輸入異常原因"
            rows="3"
          ></textarea>
        </div>

        <div class="form-group">
          <label>備註</label>
          <textarea
            class="form-textarea"
            [(ngModel)]="formData.notes"
            placeholder="其他備註（選填）"
            rows="2"
          ></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
        <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!isFormValid">提交</button>
      </div>
    </div>
  </div>
}
