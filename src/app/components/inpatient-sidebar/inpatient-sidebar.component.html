<aside class="inpatient-sidebar">
    <!-- 【修改 2/2】: 更新標題和列表項的顯示邏輯 -->
    <h3>住院/急診病人 (可拖曳)</h3>
    <div class="filter-group" [ngClass]="{ 'daily-filter-layout': useDailyFilter }">
      <!-- 每日篩選模式的按鈕 -->
      @if (useDailyFilter) {
        <ng-container>
          <button (click)="inpatientFilter = 'all'" [ngClass]="{ active: inpatientFilter === 'all' }">
            全部
          </button>
          <button (click)="inpatientFilter = 'today'" [ngClass]="{ active: inpatientFilter === 'today' }">
            當日應排
          </button>
          <button
            (click)="inpatientFilter = 'other_day'"
            [ngClass]="{ active: inpatientFilter === 'other_day' }"
          >
            非當日(臨洗)
          </button>
        </ng-container>
      }
    </div>
</aside>
