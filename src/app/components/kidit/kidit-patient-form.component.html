<div class="kidit-patient-form">
  <div class="form-header">
    <h4 class="form-title">透析處方</h4>
    <span class="form-date">{{ date }}</span>
  </div>

  <div class="form-body">
    <section class="form-section">
      <h5 class="section-title">基本參數</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>乾體重 (kg)</label>
          <input
            type="number"
            [(ngModel)]="formData.dryWeight"
            (ngModelChange)="onPreWeightChange()"
            placeholder="0.0"
            step="0.1"
          />
        </div>
        <div class="form-field">
          <label>透析前體重 (kg)</label>
          <input
            type="number"
            [(ngModel)]="formData.preWeight"
            (ngModelChange)="onPreWeightChange()"
            placeholder="0.0"
            step="0.1"
          />
        </div>
        <div class="form-field">
          <label>預估脫水 (kg)</label>
          <span class="computed">{{ estimatedUF }}</span>
        </div>
        <div class="form-field">
          <label>目標脫水 (kg)</label>
          <input
            type="number"
            [(ngModel)]="formData.targetUF"
            (ngModelChange)="onFieldChange()"
            placeholder="0.0"
            step="0.1"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">透析設定</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>人工腎臟</label>
          <select [(ngModel)]="formData.dialyzerType" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option *ngFor="let opt of dialyzerOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>透析時間 (hr)</label>
          <input
            type="number"
            [(ngModel)]="formData.dialysisTime"
            (ngModelChange)="onFieldChange()"
            min="1"
            max="8"
            step="0.5"
          />
        </div>
        <div class="form-field">
          <label>血液流速 (ml/min)</label>
          <input
            type="number"
            [(ngModel)]="formData.bloodFlowRate"
            (ngModelChange)="onFieldChange()"
            min="100"
            max="500"
            step="10"
          />
        </div>
        <div class="form-field">
          <label>透析液流速 (ml/min)</label>
          <input
            type="number"
            [(ngModel)]="formData.dialysateFlowRate"
            (ngModelChange)="onFieldChange()"
            min="300"
            max="800"
            step="50"
          />
        </div>
        <div class="form-field">
          <label>透析液 Ca</label>
          <select [(ngModel)]="formData.dialysateCa" (ngModelChange)="onFieldChange()">
            <option *ngFor="let opt of dialysateCaOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>透析液 K</label>
          <select [(ngModel)]="formData.dialysateK" (ngModelChange)="onFieldChange()">
            <option *ngFor="let opt of dialysateKOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">抗凝血</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>抗凝血劑</label>
          <select [(ngModel)]="formData.anticoagulant" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option *ngFor="let opt of anticoagulantOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>劑量</label>
          <input
            type="text"
            [(ngModel)]="formData.anticoagulantDose"
            (ngModelChange)="onFieldChange()"
            placeholder="如 1000U loading + 500U/hr"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">血管通路</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>通路類型</label>
          <select [(ngModel)]="formData.vascularAccess" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option *ngFor="let opt of accessOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>針號</label>
          <select [(ngModel)]="formData.needleSize" (ngModelChange)="onFieldChange()">
            <option *ngFor="let opt of needleSizeOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">透析前生命徵象</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>收縮壓 (mmHg)</label>
          <input
            type="number"
            [(ngModel)]="formData.preBPSys"
            (ngModelChange)="onFieldChange()"
            placeholder="120"
          />
        </div>
        <div class="form-field">
          <label>舒張壓 (mmHg)</label>
          <input
            type="number"
            [(ngModel)]="formData.preBPDia"
            (ngModelChange)="onFieldChange()"
            placeholder="80"
          />
        </div>
        <div class="form-field">
          <label>心率 (bpm)</label>
          <input
            type="number"
            [(ngModel)]="formData.preHR"
            (ngModelChange)="onFieldChange()"
            placeholder="72"
          />
        </div>
        <div class="form-field">
          <label>體溫 (°C)</label>
          <input
            type="number"
            [(ngModel)]="formData.preTemp"
            (ngModelChange)="onFieldChange()"
            placeholder="36.5"
            step="0.1"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">備註</h5>
      <textarea
        class="notes-input"
        [(ngModel)]="formData.notes"
        (ngModelChange)="onFieldChange()"
        rows="3"
        placeholder="其他注意事項..."
      ></textarea>
    </section>
  </div>
</div>
