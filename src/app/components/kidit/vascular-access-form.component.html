<div class="vascular-access-form">
  <div class="form-header">
    <h4 class="form-title">血管通路記錄</h4>
    <span class="form-date">{{ date }}</span>
  </div>

  <div class="form-body">
    <section class="form-section">
      <h5 class="section-title">通路基本資料</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>通路類型</label>
          <select [(ngModel)]="formData.accessType" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option *ngFor="let opt of accessTypes" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>位置</label>
          <select [(ngModel)]="formData.location" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option *ngFor="let opt of locationOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>側別</label>
          <select [(ngModel)]="formData.side" (ngModelChange)="onFieldChange()">
            <option value="">請選擇</option>
            <option value="left">左側</option>
            <option value="right">右側</option>
          </select>
        </div>
        <div class="form-field">
          <label>建立日期</label>
          <input
            type="date"
            [(ngModel)]="formData.creationDate"
            (ngModelChange)="onFieldChange()"
          />
        </div>
        <div class="form-field">
          <label>手術醫師</label>
          <input
            type="text"
            [(ngModel)]="formData.surgeon"
            (ngModelChange)="onFieldChange()"
            placeholder="醫師姓名"
          />
        </div>
        <div class="form-field">
          <label>目前狀態</label>
          <select [(ngModel)]="formData.status" (ngModelChange)="onFieldChange()">
            <option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
      </div>
    </section>

    <section class="form-section" *ngIf="isAVAccess">
      <h5 class="section-title">通路評估</h5>
      <div class="fields-grid">
        <div class="form-field">
          <label>通路流量 (ml/min)</label>
          <input
            type="number"
            [(ngModel)]="formData.flowRate"
            (ngModelChange)="onFieldChange()"
            placeholder="0"
          />
        </div>
        <div class="form-field">
          <label>最近評估日期</label>
          <input
            type="date"
            [(ngModel)]="formData.lastAssessmentDate"
            (ngModelChange)="onFieldChange()"
          />
        </div>
        <div class="form-field">
          <label>動脈端穿刺位置</label>
          <input
            type="text"
            [(ngModel)]="formData.needleSites.arterial"
            (ngModelChange)="onFieldChange()"
            placeholder="穿刺位置描述"
          />
        </div>
        <div class="form-field">
          <label>靜脈端穿刺位置</label>
          <input
            type="text"
            [(ngModel)]="formData.needleSites.venous"
            (ngModelChange)="onFieldChange()"
            placeholder="穿刺位置描述"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">併發症</h5>
      <div class="chip-grid">
        <button
          *ngFor="let item of complicationList"
          class="chip"
          [class.active]="isComplicationActive(item)"
          (click)="toggleComplication(item)"
          type="button"
        >
          {{ item }}
        </button>
      </div>
    </section>

    <section class="form-section">
      <div class="section-header">
        <h5 class="section-title">介入處置記錄</h5>
        <button
          class="add-intervention-btn"
          (click)="showAddIntervention = true"
          *ngIf="!showAddIntervention"
          type="button"
        >
          + 新增
        </button>
      </div>

      <div class="add-intervention-form" *ngIf="showAddIntervention">
        <div class="fields-grid">
          <div class="form-field">
            <label>日期</label>
            <input type="date" [(ngModel)]="newIntervention.date" />
          </div>
          <div class="form-field">
            <label>處置類型</label>
            <select [(ngModel)]="newIntervention.type">
              <option value="">請選擇</option>
              <option *ngFor="let opt of interventionTypes" [value]="opt">{{ opt }}</option>
            </select>
          </div>
          <div class="form-field">
            <label>詳情</label>
            <input type="text" [(ngModel)]="newIntervention.detail" placeholder="處置說明" />
          </div>
          <div class="form-field">
            <label>結果</label>
            <input type="text" [(ngModel)]="newIntervention.outcome" placeholder="處置結果" />
          </div>
        </div>
        <div class="intervention-actions">
          <button class="btn btn-cancel" (click)="showAddIntervention = false" type="button">取消</button>
          <button class="btn btn-save" (click)="addIntervention()" type="button">新增</button>
        </div>
      </div>

      <div class="interventions-list" *ngIf="formData.interventions.length > 0">
        <div
          *ngFor="let record of formData.interventions; let i = index"
          class="intervention-row"
        >
          <span class="intervention-date">{{ record.date }}</span>
          <span class="intervention-type">{{ record.type }}</span>
          <span class="intervention-detail">{{ record.detail }}</span>
          <span class="intervention-outcome">{{ record.outcome }}</span>
          <button class="remove-btn" (click)="removeIntervention(i)" title="移除" type="button">&times;</button>
        </div>
      </div>

      <div class="empty-interventions" *ngIf="formData.interventions.length === 0 && !showAddIntervention">
        尚無介入處置記錄
      </div>
    </section>

    <section class="form-section">
      <h5 class="section-title">備註</h5>
      <textarea
        class="notes-input"
        [(ngModel)]="formData.notes"
        (ngModelChange)="onFieldChange()"
        rows="3"
        placeholder="其他注意事項..."
      ></textarea>
    </section>
  </div>
</div>
