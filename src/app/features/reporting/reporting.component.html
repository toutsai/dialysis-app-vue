<div class="page-container">
  <h1 class="page-title">統計報表</h1>
  <div class="toolbar">
    <select class="toolbar-select">
      @for (type of reportTypes; track type) {
        <option>{{ type }}</option>
      }
    </select>
    <button class="toolbar-btn">產生報表</button>
    <button class="toolbar-btn">匯出</button>
  </div>
  <div class="content">
    <div class="card">
      <div class="chart-placeholder">
        <p>此頁面正在建構中...</p>
        <p class="placeholder-hint">選擇報表類型後點擊「產生報表」</p>
      </div>
    </div>
  </div>
</div>
