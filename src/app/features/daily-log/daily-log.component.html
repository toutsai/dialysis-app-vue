<div class="page-container">
  <h1 class="page-title">工作日誌</h1>
  <div class="toolbar">
    <span class="toolbar-date">{{ formattedDate }}</span>
    <button class="toolbar-btn primary-btn">新增日誌</button>
    <button class="toolbar-btn">歷史紀錄</button>
  </div>
  <div class="content">
    <div class="card">
      <div class="log-list">
        <div class="empty-state">
          <p>今日尚無工作日誌</p>
          <p class="empty-hint">點擊「新增日誌」開始記錄今日工作內容</p>
        </div>
      </div>
    </div>
  </div>
</div>
