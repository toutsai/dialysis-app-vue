<div class="page-container">
  <h1 class="page-title">平台使用說明</h1>
  <p class="page-description">以下是各功能模組的使用說明，點擊標題展開詳細內容。</p>
  <div class="content">
    <div class="guide-list">
      @for (section of sections; track section.id) {
        <div class="guide-section" [class.expanded]="isSectionExpanded(section.id)">
          <button
            class="section-header"
            (click)="toggleSection(section.id)"
            [attr.aria-expanded]="isSectionExpanded(section.id)"
          >
            <span class="section-title">{{ section.title }}</span>
            <span class="section-icon">
              {{ isSectionExpanded(section.id) ? '−' : '+' }}
            </span>
          </button>
          @if (isSectionExpanded(section.id)) {
            <div class="section-body">
              <p>{{ section.content }}</p>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
