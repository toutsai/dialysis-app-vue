<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">部北透析管理平台</h1>
      <p class="login-subtitle">Dialysis Management Platform</p>
    </div>

    <form class="login-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label class="form-label" for="username">帳號</label>
        <input
          id="username"
          type="text"
          class="form-input"
          placeholder="請輸入帳號"
          [value]="username()"
          (input)="onUsernameInput($event)"
          [disabled]="authService.authLoading()"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密碼</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input password-input"
            placeholder="請輸入密碼"
            [value]="password()"
            (input)="onPasswordInput($event)"
            [disabled]="authService.authLoading()"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? '隱藏密碼' : '顯示密碼'"
          >
            {{ showPassword() ? '隱藏' : '顯示' }}
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          <span class="error-icon">!</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button
        type="submit"
        class="login-btn"
        [disabled]="!isFormValid || authService.authLoading()"
        [class.loading]="authService.authLoading()"
      >
        @if (authService.authLoading()) {
          <span class="spinner"></span>
          <span>登入中...</span>
        } @else {
          <span>登入</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p>如遇到登入問題，請聯繫系統管理員</p>
    </div>
  </div>
</div>
