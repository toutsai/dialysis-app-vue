# 檔案路徑: .github/workflows/deploy-to-main.yml

name: Deploy to Production Environment

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_to_prod:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_PROD }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_PROD }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_PROD }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_PROD }}
      # ✨ 核心修正 1：設定一個絕對可靠的憑證檔案路徑
      # GITHUB_WORKSPACE 是 GitHub Actions 提供的預設環境變數，指向當前專案的根目錄
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google-credentials.json

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies and Build for Production
        run: |
          npm ci
          npm ci --prefix functions
          npm run build

      # ✨ 核心修正 2：將憑證寫入工作區的檔案中，而不是/tmp
      - name: Authenticate with Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > ${{ github.workspace }}/google-credentials.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✨ 核心修正 3：拆分指令，確保每個指令都能讀取到環境變數
      # 這裡我們直接使用 firebase deploy 指令，以獲得最清晰的日誌輸出
      - name: Deploy Firestore Rules (Production)
        run: firebase deploy --only firestore:rules --project production

      - name: Deploy Cloud Functions (Production)
        run: firebase deploy --only functions --project production

      - name: Deploy Firebase Hosting (Production)
        run: firebase deploy --only hosting:production --project production
