# 檔案路徑: .github/workflows/deploy-to-main.yml (修正版)

name: Deploy to Production Environment

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_to_prod:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_PROD }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_PROD }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_PROD }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_PROD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix functions

      # ✨ 修正 1：保持這個現代化的驗證方式，這是正確的
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✨ 修正 2：移除所有 'firebase use' 指令，改用 --project 旗標直接部署
      - name: Deploy to Firebase (Production)
        run: |
          # 我們直接在 deploy 指令中明確指定專案 ID
          # 這樣就不需要依賴任何本地狀態，非常適合 CI/CD 環境
          # 提示: --only 後面的參數請根據您實際需要部署的服務調整
          firebase deploy --project ${{ env.VITE_FIREBASE_PROJECT_ID_PROD }} --only hosting,functions,firestore,rules
