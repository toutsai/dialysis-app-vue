# 檔案路徑: .github/workflows/deploy-to-main.yml (最終修正版)

name: Deploy to Production Environment

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_to_prod:
    runs-on: ubuntu-latest
    # 【關鍵修正 1】: 將服務帳戶密鑰設定在 Job 層級
    # 這個 Secret 必須是「原始 JSON 內容」，而不是 Base64 編碼！
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIALYSIS_SCHEDULE_CD36C }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD }}
      # ... 其他 VITE 環境變數 ...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build

      # 【關鍵修正 2】: 使用單一的官方 Action 來部署所有東西
      - name: Deploy to Firebase (Rules, Functions, and Hosting)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          # 將 JSON 內容直接傳遞給這個 Action
          firebaseServiceAccount: '${{ env.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: dialysis-schedule-cd36c
          # 【重要】: 在這裡指定你要部署的所有東西！
          # target: 'production' 是指 firebase.json 中 hosting 的 target 名稱
          # deploy: 'firestore,functions,hosting' 是要執行的部署命令
          entryPoint: . # 指向專案根目錄
          target: production
          # 您可以根據需要調整要部署的項目，例如 'firestore,hosting'
          args: --only firestore,functions,hosting
