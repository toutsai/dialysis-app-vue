# 檔案路徑: .github/workflows/deploy-to-develop.yml

name: Deploy to Development Environment

on:
  push:
    branches:
      - develope-branch # <--- 請再次確認這個分支名稱

jobs:
  build_and_deploy_to_dev:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_DEV }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_DEV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix functions

      # 🔥【關鍵修正 1】: 將服務帳號的 secret 寫入一個暫存的 JSON 檔案
      - name: Authenticate with Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > /tmp/google-credentials.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build and Deploy All to Firebase (Develop)
        run: npm run deploy:dev
        env:
          # 🔥【關鍵修正 2】: 告訴 Firebase CLI 去哪裡找驗證檔案
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json
