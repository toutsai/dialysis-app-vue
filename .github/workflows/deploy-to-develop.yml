# 檔案路徑: .github/workflows/deploy-to-develop.yml (擴充後的完整版 - 方法二)

name: Deploy to Development Environment

on:
  push:
    branches:
      - develope-branch # <--- 請再次確認這個分支名稱

jobs:
  build_and_deploy_to_dev:
    runs-on: ubuntu-latest
    # 【重要】env 部分保持不變，因為 build:dev 仍然需要它來建立前端
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_DEV }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_DEV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 分別安裝根目錄和 functions 目錄的依賴
      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix functions

      # 🔥【關鍵】: 直接執行您在 package.json 中定義好的一鍵部署腳本
      - name: Deploy All to Firebase (Develop)
        run: npm run deploy:dev
        env:
          # 身份驗證，使用服務帳號或CI Token
          # 服務帳號是推薦的做法，因為它不會過期
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }} # 從 firebase login:ci 取得
          # 如果使用服務帳號 (更推薦)
          # GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
