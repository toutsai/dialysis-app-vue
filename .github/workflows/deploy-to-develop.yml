# 檔案路徑: .github/workflows/deploy-to-develop.yml (最終修正版)

name: Deploy to Development Environment

on:
  push:
    branches:
      - develope-branch # <--- 請再次確認這個分支名稱

jobs:
  build_and_deploy_to_dev:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_DEV }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_DEV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✨ 核心修正：不再執行 npm script，而是直接執行完整的 firebase 指令
      - name: Build and Deploy to Firebase (Develop)
        run: |
          # 1. 執行 Vue 的打包程序
          npm run build

          # 2. 執行 Firebase 部署指令，並明確傳入專案ID
          # --non-interactive: 確保在 CI/CD 環境中不會有任何互動提示卡住流程
          # --force: 強制部署，覆蓋現有部署
          firebase deploy --project ${{ env.VITE_FIREBASE_PROJECT_ID_DEV }} --non-interactive --force --only hosting,functions,firestore:rules
